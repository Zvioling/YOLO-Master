# YOLO-Master-EsMoE-N for VisDrone (10 classes) - Cross-Scale Shared Variant
# 端侧轻量化版本：跨尺度专家共享（Cross-Scale Expert Pool Sharing）
#
# 设计动机（对齐 Issue #54 方案 D 的跨尺度共享经验）：
#   - 基线 yolo-master-esmoe-n-visdrone.yaml 有 4 个 ES_MOE 层（scale 后通道 64/128/128/256），
#     每层 4 个独立 expert → 共 16 个 expert
#   - 方案 D（v08_moe_mot_shared）证明：同通道、不同分辨率（stride）的两层共享 expert pool
#     可减少参数 ~19-25%，且 GPU 延迟 ↓10.84%（跨尺度特征交互带来鲁棒性）
#
# 本设计：
#   - P4 (model.6, 128ch, stride=8) 与 P5 (model.9, 128ch, stride=16) 共享同一组 4 个 experts
#     → 跨尺度共享：同一 expert 同时服务浅层/中层，参数共享 + 特征交互
#   - P3 (model.3, 64ch) 独立 pool（通道太小，跨尺度共享收益低）
#   - P6 (model.12, 256ch) 独立 pool（深层特征差异大，与方案 D P5 独立设计一致）
#   - 总 expert 数：16 → 12（-25%）
#
# 预期收益（基于方案 D 的 -19.1% 参数、-10.84% GPU 延迟经验）：
#   - 参数量 ↓ 15-25%
#   - GPU 延迟 ↓ 10-20%
#   - 内存占用 ↓ 25%
#   - 精度损失 < 1%

nc: 10 # number of classes
scales:
  n: [0.50, 0.25, 1024]

# ES-MoE 跨尺度共享配置
# 相同 pool_id 的 SharedExpertESMoE 实例共享同一组 expert 参数（仅路由独立）。
# 约束：共享 pool 的实例必须有相同 in_channels / out_channels / num_experts / top_k。

backbone:
  # ===== P1/P2: 标准卷积（无 MoE） =====
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]

  # ===== P3: 64-channel 独立 expert pool =====
  - [-1, 1, SharedExpertESMoE, [256, 4, 2, "esmoe_p3"]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]

  # ===== P4: 128-channel expert pool owner =====
  - [-1, 1, SharedExpertESMoE, [512, 4, 2, "esmoe_p4_p5"]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 4, A2C2f, [512, True, 4]]

  # ===== P5: 128-channel 复用 P4 的 expert pool（跨尺度共享） =====
  - [-1, 1, SharedExpertESMoE, [512, 4, 2, "esmoe_p4_p5"]]

  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 4, A2C2f, [1024, True, 1]]

  # ===== P6: 256-channel 独立 expert pool =====
  - [-1, 1, SharedExpertESMoE, [1024, 4, 2, "esmoe_p6"]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [[18, 21, 24], 1, Detect, [nc]]
