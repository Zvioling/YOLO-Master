# YOLO-Master v0.8 MoE+MoT Hybrid (方案 A) 🚀 AGPL-3.0 License
# Backbone: 3 MoE blocks (与 v08_mot 保持)
# Head: 4 C2fMoT blocks (v08_mot 基础上 P3 浅层 +1)
# 保守型变体，首次把 C2fMoT 扩展到 P3 浅层，验证浅层路由对全尺度目标检测的影响

nc: 80
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                         # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]                  # 2
  - [-1, 1, Conv, [256, 3, 2]]                         # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]                  # 4
  - [-1, 1, LowRankHybridAdaptiveGateMoE, [512, 4, 2, 0.5]]  # 5 - P3/P4 MoE
  - [-1, 1, Conv, [512, 3, 2]]                         # 6-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]                     # 7
  - [-1, 1, LowRankHybridAdaptiveGateMoE, [512, 8, 2, 0.5]]  # 8 - P4/P5 MoE
  - [-1, 1, Conv, [1024, 3, 2]]                        # 9-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]                    # 10
  - [-1, 1, LowRankHybridAdaptiveGateMoE, [1024, 16, 2, 0.5]]  # 11 - P5 MoE

head:
  # P5 → P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]]                          # cat backbone P4
  # C2fMoT: [c2, n, num_heads, top_k, window_size, n_points, mlp_ratio, temp, balance_coeff, e]
  - [-1, 2, C2fMoT, [512, 2, 8, 2, 7, 4, 2.0, 1.0, 0.01, 0.5]]  # 14 - MoT in neck P4

  # P4 → P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]]                          # cat backbone P3
  - [-1, 2, C2fMoT, [256, 2, 8, 2, 7, 4, 2.0, 0.8, 0.01, 0.5]]  # 17 - P3 浅层 MoT（创新）

  # P3 → P4 bottom-up
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]                         # cat head P4
  - [-1, 2, C2fMoT, [512, 2, 8, 2, 7, 4, 2.0, 0.8, 0.01, 0.5]]  # 20 - MoT in head P4

  # P4 → P5 bottom-up
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]                         # cat backbone P5
  - [-1, 2, C2fMoT, [512, 2, 8, 1, 7, 4, 2.0, 0.8, 0.01, 0.5]]  # 23 - MoT in head P5 (top_k=1 减 P5 计算)

  - [[17, 20, 23], 1, Detect, [nc]]                    # Detect(P3, P4, P5)
